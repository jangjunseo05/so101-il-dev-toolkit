# SO-101 파이프라인/대시보드용 conda 환경.
# 실제 동작 확인된 mujoco_env를 그대로 내보낸 것(2026-08-16 기준) — 직접
# 만든 "이상적인" 목록이 아님. 아래 두 pip-check 경고는 알려진 상태이며
# 파이프라인 동작에 지장이 없음이 확인되어 있어 의도적으로 그대로 둔다
# (버전을 바꾸지 말 것 — CLAUDE.md 28절 참고):
#   - datasets 4.8.5 는 fsspec<=2026.2.0 을 요구하지만 fsspec 2026.7.0 설치됨
#   - opencv-python-headless 는 numpy<2.3.0 을 요구하지만 numpy 2.4.6 설치됨
#
# torch/torchvision은 CUDA wheel이라 conda로 못 받는다 — 별도 설치 필요.
# 정확한 커맨드는 docs/NEW_TEAMMATE_SETUP.md 3단계 참고.
